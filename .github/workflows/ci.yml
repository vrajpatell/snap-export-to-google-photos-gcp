name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - name: Install Python runtime and test dependencies
        run: |
          pip install -q -r requirements.lock
          pip install -q pytest pytest-cov ruff black mypy types-python-dateutil
      - run: ruff check .
      - name: Run mypy and capture existing findings
        continue-on-error: true
        run: mypy app 2>&1 | tee mypy-report.txt
      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report.txt
      - run: pytest -q
      - run: npm install
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
