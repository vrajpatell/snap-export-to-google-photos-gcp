name: dependency-refresh

on:
  push:
    branches: [codex/fix-ci-e2e-security]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[deps-refresh]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-ci-e2e-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile and apply safe audit fixes
        working-directory: frontend
        run: |
          npm install
          npm audit fix
          npm audit --audit-level=high
      - name: Commit refreshed dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
          else
            git commit -m "Refresh frontend dependency lockfile [deps-refresh]"
            git push origin HEAD:codex/fix-ci-e2e-security
          fi
